# Package definition for pnpm

package_name: pnpm
github_repo: pnpm/pnpm
artifact_format: tar.gz
description: "A fast, disk space efficient package manager for JavaScript/Node.js, using a content-addressable store to avoid duplicating dependencies."
license: MIT

# pnpm ships a Node single-executable-application binary that needs its
# own dist/ directory alongside it at runtime (looked up relative to the
# binary's own location) - bundle keeps them as siblings under
# /usr/lib/pnpm/ instead of flattening just the top-level binary and
# discarding dist/ (requires debian-multiarch-builder v.0.1a20+, which
# added root-level executable discovery for bundles with no bin/
# subdirectory).
bundle: true

# The binary dynamically links against libatomic.so.1, which a bare
# Debian install doesn't have - without this, `pnpm --version` fails with
# "error while loading shared libraries: libatomic.so.1: cannot open
# shared object file" (requires debian-multiarch-builder v.0.1a19+).
depends: libatomic1

# pnpm publishes both a glibc build and a musl build per architecture
# (e.g. pnpm-linux-x64.tar.gz vs pnpm-linux-x64-musl.tar.gz) - the musl
# build's ELF interpreter (/lib/ld-musl-x86_64.so.1) doesn't exist on a
# glibc-based system like Debian at all ("cannot execute: required file
# not found"), so auto-discovery's pattern matching has to be pinned to
# the glibc variant explicitly rather than risk it picking the musl one,
# same reasoning as atuin/duckdb/bun's release_pattern overrides. pnpm
# only publishes Linux builds for these two architectures.
architectures:
  amd64:
    release_pattern: "pnpm-linux-x64.tar.gz"
  arm64:
    release_pattern: "pnpm-linux-arm64.tar.gz"
